name: charter-cid-comment

on:
  workflow_run:
    workflows: ["charter-cid-check"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    # workflow_run always runs the copy of this file from the base branch, so a fork
    # PR can't alter this job's permissions. Don't trust anything from the artifact
    # for *which* PR to comment on though (a fork PR could edit charter-cid-check.yml
    # to fabricate that) — get the PR number from the event payload instead, which
    # GitHub populates itself from the actual originating PR.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: charter-cid-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment-body.md', 'utf8');
            const prNumber = context.payload.workflow_run.pull_requests[0].number;
            const marker = '<!-- charter-cid-check -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
